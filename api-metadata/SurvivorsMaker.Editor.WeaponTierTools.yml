- uid: SurvivorsMaker.Editor.WeaponTierTools.CreateNextTier(SurvivorsMaker.Data.WeaponAsset,System.String,SurvivorsMaker.Editor.NextTierCreationSettings)
  commentId: M:SurvivorsMaker.Editor.WeaponTierTools.CreateNextTier(SurvivorsMaker.Data.WeaponAsset,System.String,SurvivorsMaker.Editor.NextTierCreationSettings)
  id: CreateNextTier(SurvivorsMaker.Data.WeaponAsset,System.String,SurvivorsMaker.Editor.NextTierCreationSettings)
  parent: SurvivorsMaker.Editor.WeaponTierTools
  langs:
  - csharp
  - vb
  name: CreateNextTier(WeaponAsset, string, NextTierCreationSettings)
  nameWithType: WeaponTierTools.CreateNextTier(WeaponAsset, string, NextTierCreationSettings)
  fullName: SurvivorsMaker.Editor.WeaponTierTools.CreateNextTier(SurvivorsMaker.Data.WeaponAsset, string, SurvivorsMaker.Editor.NextTierCreationSettings)
  type: Method
  assemblies:
  - SurvivorsMaker.Editor
  namespace: SurvivorsMaker.Editor
  summary: 'Creates the next tier as a new asset and links it from <code class="paramref">source</code>, all as one undo step.
    The tier

    takes Tier + 1, an id "&lt;family&gt;_&lt;tier&gt;" and scaled numbers; its name and description stay empty so the

    UI inherits the previous tier''s text. Optionally registers it next to the source in content lists and copies the

    source''s view entry. Never overwrites a file or an existing NextTier link.'
  example: []
  syntax:
    content: public static WeaponAsset CreateNextTier(WeaponAsset source, string requestedPath, NextTierCreationSettings settings)
    parameters:
    - id: source
      type: SurvivorsMaker.Data.WeaponAsset
    - id: requestedPath
      type: System.String
    - id: settings
      type: SurvivorsMaker.Editor.NextTierCreationSettings
    return:
      type: SurvivorsMaker.Data.WeaponAsset
    content.vb: Public Shared Function CreateNextTier(source As WeaponAsset, requestedPath As String, settings As NextTierCreationSettings)
      As WeaponAsset
  overload: SurvivorsMaker.Editor.WeaponTierTools.CreateNextTier*
