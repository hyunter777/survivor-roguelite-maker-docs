  name: IPlaytestCommands
  nameWithType: IPlaytestCommands
  fullName: SurvivorsMaker.Run.IPlaytestCommands
  type: Interface
  assemblies:
  - SurvivorsMaker.Run
  namespace: SurvivorsMaker.Run
  summary: 'Development cheats for the in-game Playtest panel. Implemented by Run/Flow on

    top of RunController. Calls are rejected with <xref href="SurvivorsMaker.Run.RunResult.WrongPhase" data-throw-if-not-resolved="false"></xref>
    or

    <xref href="SurvivorsMaker.Run.RunResult.NotAllowed" data-throw-if-not-resolved="false"></xref> instead of throwing. A
    run that used any of them is marked

    <xref href="SurvivorsMaker.Run.IPlaytestCommands.UsedCheats" data-throw-if-not-resolved="false"></xref> so records and
    unlocks can ignore it.'
  example: []
  syntax:
    content: public interface IPlaytestCommands
    content.vb: Public Interface IPlaytestCommands
  derivedClasses:
  - SurvivorsMaker.Run.RunController
