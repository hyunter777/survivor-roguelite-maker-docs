- uid: SurvivorsMaker.Presentation.ICustomEventView
  commentId: T:SurvivorsMaker.Presentation.ICustomEventView
  id: ICustomEventView
  parent: SurvivorsMaker.Presentation
  children:
  - SurvivorsMaker.Presentation.ICustomEventView.Show(SurvivorsMaker.Simulation.SimEvent,SurvivorsMaker.Simulation.SimWorld,SurvivorsMaker.Presentation.WorldView)
  langs:
  - csharp
