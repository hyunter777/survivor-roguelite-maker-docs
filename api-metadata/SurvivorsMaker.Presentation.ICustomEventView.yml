  name: ICustomEventView
  nameWithType: ICustomEventView
  fullName: SurvivorsMaker.Presentation.ICustomEventView
  type: Interface
  assemblies:
  - SurvivorsMaker.Presentation
  namespace: SurvivorsMaker.Presentation
  summary: 'Shows one game-defined event (<xref href="SurvivorsMaker.Simulation.SimEvent.CustomId" data-throw-if-not-resolved="false"></xref>).
    Register it with <xref href="SurvivorsMaker.Presentation.WorldView.RegisterCustomEvent(System.String%2cSurvivorsMaker.Presentation.ICustomEventView)"
    data-throw-if-not-resolved="false"></xref>.

    Called once per event during the fixed tick, after the built-in visuals. Read the world; never change it.

    Sounds for custom ids come from <xref href="SurvivorsMaker.Presentation.SoundCatalogAsset.CustomEvents" data-throw-if-not-resolved="false"></xref>,
    simple effects from

    <xref href="SurvivorsMaker.Presentation.PresentationSettings.CustomEvents" data-throw-if-not-resolved="false"></xref>.'
  example: []
  syntax:
    content: public interface ICustomEventView
    content.vb: Public Interface ICustomEventView
