  name: SurvivorsSceneBootstrap
  nameWithType: SurvivorsSceneBootstrap
  fullName: SurvivorsMaker.Presentation.SurvivorsSceneBootstrap
  type: Class
  assemblies:
  - SurvivorsMaker.Presentation
  namespace: SurvivorsMaker.Presentation
  summary: 'One component that turns a scene into a playable game: it connects the session (<xref href="SurvivorsMaker.Presentation.SurvivorsGame"
    data-throw-if-not-resolved="false"></xref>),

    input, the world view, the UI, music and interface sounds to your content and catalogs. Empty scene references

    are found in the scene or created. Both run modes work in one scene: the menu''s mode toggle switches between

    <xref href="SurvivorsMaker.Presentation.SurvivorsSceneBootstrap.ArenaSettings" data-throw-if-not-resolved="false"></xref>
    and <xref href="SurvivorsMaker.Presentation.SurvivorsSceneBootstrap.FieldSettings" data-throw-if-not-resolved="false"></xref>.

    Customise from code with an <xref href="SurvivorsMaker.Presentation.ISceneBootstrapExtension" data-throw-if-not-resolved="false"></xref>
    component on the same GameObject.'
  example: []
  syntax:
    content: '[DefaultExecutionOrder(-50)]

      [AddComponentMenu("Survivor Roguelite Maker/Survivors Scene Bootstrap")]

      public sealed class SurvivorsSceneBootstrap : MonoBehaviour'
    content.vb: '<DefaultExecutionOrder(-50)>

      <AddComponentMenu("Survivor Roguelite Maker/Survivors Scene Bootstrap")>

      Public NotInheritable Class SurvivorsSceneBootstrap Inherits MonoBehaviour'
