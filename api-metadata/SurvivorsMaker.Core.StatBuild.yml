  summary: 'Explains one cached evaluation without replaying handlers, conversions, captures or debits.

    Allocates only on this explicit call; Get/Inspect and tick evaluation are unchanged.

    Set entries are deltas from the preceding fold in their own layer. Limits follow scalar

    entries, then final rounding. Custom/store contributions are an unattributed net residual:

    arbitrary handler state cannot safely be replayed to discover per-provider amounts.'
