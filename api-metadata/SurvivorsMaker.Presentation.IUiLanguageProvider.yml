  summary: 'Supplies the languages the settings screen offers and the text lookup for each. Plug a localization system in

    through <xref href="SurvivorsMaker.Presentation.GameUiRoot.Languages" data-throw-if-not-resolved="false"></xref>; the
    resolver is installed as <xref href="SurvivorsMaker.Presentation.UiStrings.Resolve" data-throw-if-not-resolved="false"></xref>
    and

    keys it does not know fall back to the string table.'
