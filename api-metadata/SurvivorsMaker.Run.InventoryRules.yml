  nameWithType: InventoryRules.BuildStats(RunState)
  fullName: SurvivorsMaker.Run.InventoryRules.BuildStats(SurvivorsMaker.Run.RunState)
  type: Method
  assemblies:
  - SurvivorsMaker.Run
  namespace: SurvivorsMaker.Run
  summary: 'Restores continuing grants first in stored order, then character, acquired items and sets.

    New captured effects therefore see existing grants; saved captures are never recaptured.

    CollectEffects remains a recipe-only API and must not also receive these grants.'
  example: []
  syntax:
    content: public StatBuild BuildStats(RunState run)
    parameters:
    - id: run
      type: SurvivorsMaker.Run.RunState
    return:
      type: SurvivorsMaker.Core.StatBuild
    content.vb: Public Function BuildStats(run As RunState) As StatBuild
  overload: SurvivorsMaker.Run.InventoryRules.BuildStats*
