  type: Method
  assemblies:
  - SurvivorsMaker.Run
  namespace: SurvivorsMaker.Run
  summary: 'Grants the explicitly requested weapon and the character''s starting items, in order.

    The caller invokes this once at run creation, before any other inventory gains.

    Availability, shop limits and effect-based lists do not change starting grants.'
