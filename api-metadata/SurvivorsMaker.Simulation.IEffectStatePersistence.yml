    string)
  type: Method
  assemblies:
  - SurvivorsMaker.Simulation
  namespace: SurvivorsMaker.Simulation
  summary: Restores one captured custom application into the supplied effect store; return a token suitable for later undo.
  example: []
  syntax:
    content: AppliedEffect Restore(Effect effect, EffectStore store, string payload)
    parameters:
    - id: effect
      type: SurvivorsMaker.Core.Effect
    - id: store
      type: SurvivorsMaker.Core.EffectStore
    - id: payload
      type: System.String
    return:
      type: SurvivorsMaker.Core.AppliedEffect
    content.vb: Function Restore(effect As Effect, store As EffectStore, payload As String) As AppliedEffect
  overload: SurvivorsMaker.Simulation.IEffectStatePersistence.Restore*
