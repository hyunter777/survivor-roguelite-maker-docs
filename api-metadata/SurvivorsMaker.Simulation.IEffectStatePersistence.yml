  name: IEffectStatePersistence
  nameWithType: IEffectStatePersistence
  fullName: SurvivorsMaker.Simulation.IEffectStatePersistence
  type: Interface
  assemblies:
  - SurvivorsMaker.Simulation
  namespace: SurvivorsMaker.Simulation
  summary: "Optional per-application save codec. Payloads are immutable values, never object references.\n            Restore
    applies the saved contribution to the supplied store and returns its undo record.\n            Both hooks must be deterministic
    and must not mutate shared definitions or handler-global state."
