  summary: "Polls a synchronous headless API off the editor thread. Inputs must already be copied.\n            Cancel discards
    its result; a synchronous call already in flight finishes in the background.\n            A predecessor serializes rapid
    edits so obsolete requests cannot flood the worker pool."
