  summary: 'An automated player for headless runs. One instance plays one run at a time; the runner

    calls <xref href="SurvivorsMaker.Balance.IRunBot.Begin(SurvivorsMaker.Run.RunState%2cSurvivorsMaker.Simulation.SimRandom)"
    data-throw-if-not-resolved="false"></xref> before each run. Bots must use only the random they are given so

    results stay reproducible.'
  example: []
  syntax:
    content: public interface IRunBot
    content.vb: Public Interface IRunBot
  derivedClasses:
  - SurvivorsMaker.Balance.GreedyBot
  - SurvivorsMaker.Balance.RandomBot
