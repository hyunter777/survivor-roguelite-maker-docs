- uid: SurvivorsMaker.Run.InventoryAnalysis.DescribeBuild(SurvivorsMaker.Run.RunState,SurvivorsMaker.Core.StatBuild)
  commentId: M:SurvivorsMaker.Run.InventoryAnalysis.DescribeBuild(SurvivorsMaker.Run.RunState,SurvivorsMaker.Core.StatBuild)
  id: DescribeBuild(SurvivorsMaker.Run.RunState,SurvivorsMaker.Core.StatBuild)
  parent: SurvivorsMaker.Run.InventoryAnalysis
  langs:
  - csharp
  - vb
  name: DescribeBuild(RunState, StatBuild)
  nameWithType: InventoryAnalysis.DescribeBuild(RunState, StatBuild)
  fullName: SurvivorsMaker.Run.InventoryAnalysis.DescribeBuild(SurvivorsMaker.Run.RunState, SurvivorsMaker.Core.StatBuild)
  type: Method
  assemblies:
  - SurvivorsMaker.Run
  namespace: SurvivorsMaker.Run
  summary: 'Returns active set thresholds, owned tag counts and active Link/Convert/dependent Limit

    recipes, with English invariant-culture summaries. Order: sets by Order/first encounter,

    tags by first item then weapon encounter, links by applied order. Character preference

    and ban tags are policy, not owned tags. Item/weapon tags count current owned entries;

    item expiry removal belongs to the run lifecycle, not this read-only inspection.'
  example: []
  syntax:
    content: public static BuildSynergyReport DescribeBuild(RunState run, StatBuild build = null)
    parameters:
    - id: run
      type: SurvivorsMaker.Run.RunState
    - id: build
      type: SurvivorsMaker.Core.StatBuild
    return:
      type: SurvivorsMaker.Run.BuildSynergyReport
    content.vb: Public Shared Function DescribeBuild(run As RunState, build As StatBuild = Nothing) As BuildSynergyReport
  overload: SurvivorsMaker.Run.InventoryAnalysis.DescribeBuild*
