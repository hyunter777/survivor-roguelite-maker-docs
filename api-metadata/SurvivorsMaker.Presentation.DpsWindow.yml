  - SurvivorsMaker.Presentation
  namespace: SurvivorsMaker.Presentation
  summary: 'Sliding sum over the last <xref href="SurvivorsMaker.Presentation.DpsWindow.WindowTicks" data-throw-if-not-resolved="false"></xref>
    ticks per key: one bucket per tick in a ring, so adding is O(1)

    and nothing is allocated after a key is first seen. Rates divide by the window, or by the ticks since

    <xref href="SurvivorsMaker.Presentation.DpsWindow.StartTick" data-throw-if-not-resolved="false"></xref> while fewer have
    passed (so the first second of a wave is not under-reported).'
