  namespace: SurvivorsMaker.Presentation
  summary: 'Music for the session state. No run: menu. Won/lost: menu. Shop: shop. Level-up between waves: shop

    (during a wave only when <code class="paramref">levelUpInWaveUsesShop</code>). Waves: boss while one is alive, else the
    mode''s track.'
  example: []
  syntax:
    content: public static MusicContext Choose(bool hasRun, RunPhase phase, RunMode mode, bool waveActive, bool bossAlive,
      bool levelUpInWaveUsesShop = false)
    parameters:
    - id: hasRun
      type: System.Boolean
    - id: phase
      type: SurvivorsMaker.Run.RunPhase
    - id: mode
      type: SurvivorsMaker.Run.RunMode
    - id: waveActive
      type: System.Boolean
    - id: bossAlive
      type: System.Boolean
    - id: levelUpInWaveUsesShop
      type: System.Boolean
    return:
      type: SurvivorsMaker.Presentation.MusicContext
    content.vb: Public Shared Function Choose(hasRun As Boolean, phase As RunPhase, mode As RunMode, waveActive As Boolean,
      bossAlive As Boolean, levelUpInWaveUsesShop As Boolean = False) As MusicContext
