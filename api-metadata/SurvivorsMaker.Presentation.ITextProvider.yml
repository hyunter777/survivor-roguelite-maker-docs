  fullName: SurvivorsMaker.Presentation.ITextProvider
  type: Interface
  assemblies:
  - SurvivorsMaker.Presentation
  namespace: SurvivorsMaker.Presentation
  summary: 'Text by key and language, for UI strings (<xref href="SurvivorsMaker.Presentation.UiText" data-throw-if-not-resolved="false"></xref>
    keys) and content names and descriptions

    ("&lt;key&gt;.name" / "&lt;key&gt;.description", key from <xref href="SurvivorsMaker.Data.ContentTextTable" data-throw-if-not-resolved="false"></xref>).

    Return null for anything the provider does not translate: the UI then uses the authored text

    (the UI string table, the assets'' DisplayName and Description, finally the id).

    Plug a localization system in with <xref href="SurvivorsMaker.Presentation.GameUiRoot.TextProvider" data-throw-if-not-resolved="false"></xref>;
    <xref href="SurvivorsMaker.Presentation.LocalizedTextAsset" data-throw-if-not-resolved="false"></xref> is a ready-made
    table.'
  example: []
  syntax:
    content: public interface ITextProvider
    content.vb: Public Interface ITextProvider
  derivedClasses:
  - SurvivorsMaker.Presentation.AuthoredTextProvider
  - SurvivorsMaker.Presentation.LocalizedTextAsset
