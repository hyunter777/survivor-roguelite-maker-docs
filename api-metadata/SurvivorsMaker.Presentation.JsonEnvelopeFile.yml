  name: JsonEnvelopeFile
  nameWithType: JsonEnvelopeFile
  fullName: SurvivorsMaker.Presentation.JsonEnvelopeFile
  type: Class
  assemblies:
  - SurvivorsMaker.Presentation
  namespace: SurvivorsMaker.Presentation
  summary: 'One save domain (options, profile or run) in one JSON file, written as a <xref href="SurvivorsMaker.Run.SaveEnvelope"
    data-throw-if-not-resolved="false"></xref> with

    JsonUtility and read through <xref href="SurvivorsMaker.Run.SaveMigrationRegistry.Read(SurvivorsMaker.Run.SaveEnvelope%2cSurvivorsMaker.Run.SaveDomain)"
    data-throw-if-not-resolved="false"></xref>.


    <ul><li>Writes go to a temporary file that is read back and then swapped in with <xref href="System.IO.File.Replace(System.String%2cSystem.String%2cSystem.String)"
    data-throw-if-not-resolved="false"></xref>

    (a plain copy only where the platform has no replace).</li><li>A corrupt or incompatible file is moved aside (<code>*.corrupt</code>
    / <code>*.incompatible</code>) and kept; the store then

    starts from defaults.</li><li>A file from a newer schema, or an unreadable file, is left untouched and the store refuses
    to write

    over it for the rest of the session.</li></ul>'
  example: []
