  name: UiTheme
  nameWithType: UiTheme
  fullName: SurvivorsMaker.Presentation.UiTheme
  type: Class
  assemblies:
  - SurvivorsMaker.Presentation
  namespace: SurvivorsMaker.Presentation
  summary: 'The whole UI look in one place. Defaults are a flat dark style drawn without art: rounded panels and

    buttons generated at runtime (see <xref href="SurvivorsMaker.Presentation.UiSprites" data-throw-if-not-resolved="false"></xref>).
    Assign sprites to use your own frames.

    Sizes are in reference pixels (1920 × 1080).'
