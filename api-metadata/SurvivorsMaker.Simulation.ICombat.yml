  parent: SurvivorsMaker.Simulation.ICombat
  langs:
  - csharp
  - vb
  name: DamageEnemy(SimWorld, Enemy, int, SimEventKind)
  nameWithType: ICombat.DamageEnemy(SimWorld, Enemy, int, SimEventKind)
  fullName: SurvivorsMaker.Simulation.ICombat.DamageEnemy(SurvivorsMaker.Simulation.SimWorld, SurvivorsMaker.Simulation.Enemy,
    int, SurvivorsMaker.Simulation.SimEventKind)
  type: Method
  assemblies:
  - SurvivorsMaker.Simulation
  namespace: SurvivorsMaker.Simulation
  summary: 'Damage that is not a weapon hit (status ticks, explosions, chains, trigger effects): applies

    damage (elite armor and boss invulnerability included) and emits <code class="paramref">kind</code>

    (EnemyDamaged or StatusDamage). No on-hit heal, knockback, hit effects or OnHit triggers.

    <xref href="SurvivorsMaker.Simulation.SimWorld.HitSource" data-throw-if-not-resolved="false"></xref> is set by the caller
    when a weapon is behind it.'
  example: []
  syntax:
    content: void DamageEnemy(SimWorld world, Enemy target, int damage, SimEventKind kind)
    parameters:
    - id: world
      type: SurvivorsMaker.Simulation.SimWorld
    - id: target
      type: SurvivorsMaker.Simulation.Enemy
    - id: damage
      type: System.Int32
    - id: kind
      type: SurvivorsMaker.Simulation.SimEventKind
    content.vb: Sub DamageEnemy(world As SimWorld, target As Enemy, damage As Integer, kind As SimEventKind)
  overload: SurvivorsMaker.Simulation.ICombat.DamageEnemy*
  nameWithType.vb: ICombat.DamageEnemy(SimWorld, Enemy, Integer, SimEventKind)
