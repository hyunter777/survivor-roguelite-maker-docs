  commentId: M:SurvivorsMaker.Simulation.ICombat.DamageEnemy(SurvivorsMaker.Simulation.SimWorld,SurvivorsMaker.Simulation.Enemy,System.Int32,SurvivorsMaker.Simulation.SimEventKind)
