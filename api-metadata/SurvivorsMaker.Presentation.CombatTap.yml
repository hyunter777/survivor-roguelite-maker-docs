  summary: 'Read-only wrapper around the run''s <xref href="SurvivorsMaker.Simulation.ICombat" data-throw-if-not-resolved="false"></xref>:
    forwards every call unchanged (same order, same random

    numbers) and reports the damage actually applied to a <xref href="SurvivorsMaker.Presentation.CombatLedger" data-throw-if-not-resolved="false"></xref>,
    attributed to the weapon from

    <xref href="SurvivorsMaker.Simulation.SimWorld.HitSource" data-throw-if-not-resolved="false"></xref> or the hit''s slot.
    Player damage is split into contact and enemy projectiles.'
