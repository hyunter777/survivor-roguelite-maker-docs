  summary: 'Damage that is not a weapon hit (status ticks, explosions, chains, trigger effects): applies

    damage (elite armor and boss invulnerability included) and emits <code class="paramref">kind</code>

    (EnemyDamaged or StatusDamage). No on-hit heal, knockback, hit effects or OnHit triggers.

    <xref href="SurvivorsMaker.Simulation.SimWorld.HitSource" data-throw-if-not-resolved="false"></xref> is set by the caller
    when a weapon is behind it.'
