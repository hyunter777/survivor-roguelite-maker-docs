  summary: 'Finds enemies near a point. Results include candidates outside the radius; apply exact distance and shape tests.
    Candidates appear in <xref href="SurvivorsMaker.Simulation.SimWorld.Enemies" data-throw-if-not-resolved="false"></xref>
    order, so systems give the

    same results as a full scan. Rebuilt by the tick loop after enemies move and spawns are admitted.'
