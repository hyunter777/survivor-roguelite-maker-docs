  fullName: SurvivorsMaker.Presentation.JsonFileProfileStore
  type: Class
  assemblies:
  - SurvivorsMaker.Presentation
  namespace: SurvivorsMaker.Presentation
  summary: 'Profile progress (unlocks, records) as a <xref href="SurvivorsMaker.Run.SaveEnvelope" data-throw-if-not-resolved="false"></xref>
    JSON file. The saved run lives in its own

    file (<xref href="SurvivorsMaker.Presentation.JsonFileRunStore" data-throw-if-not-resolved="false"></xref>): <xref href="SurvivorsMaker.Presentation.JsonFileProfileStore.Load"
    data-throw-if-not-resolved="false"></xref> returns no SavedRun and <xref href="SurvivorsMaker.Presentation.JsonFileProfileStore.Save(SurvivorsMaker.Run.ProfileState)"
    data-throw-if-not-resolved="false"></xref> ignores it.

    A single-file profile written by earlier package versions (profile and run together) is imported once:

    the original is kept beside it as <code>*.v1.bak</code>, the progress is rewritten here and the saved run is handed to

    the linked run store. The backup preserves runs with an unmapped arena.'
  example: []
  syntax:
    content: 'public sealed class JsonFileProfileStore : IProfileStore'
    content.vb: Public NotInheritable Class JsonFileProfileStore Implements IProfileStore
