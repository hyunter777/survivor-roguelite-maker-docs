  namespace: SurvivorsMaker.Presentation
  summary: Creates profile storage with optional routing for a run imported from the legacy combined save.
  example: []
  syntax:
    content: public JsonFileProfileStore(string path, JsonFileRunStore runs = null, Func<IReadOnlyList<string>> legacyArenaIds
      = null)
    parameters:
    - id: path
      type: System.String
      description: Nonempty profile file path.
    - id: runs
      type: SurvivorsMaker.Presentation.JsonFileRunStore
      description: Destination for an imported legacy run; null leaves it in the backup only.
    - id: legacyArenaIds
      type: System.Func{System.Collections.Generic.IReadOnlyList{System.String}}
      description: Stable arena ids in the order earlier saves indexed them (needed to import a legacy run).
    content.vb: Public Sub New(path As String, runs As JsonFileRunStore = Nothing, legacyArenaIds As Func(Of IReadOnlyList(Of
      String)) = Nothing)
