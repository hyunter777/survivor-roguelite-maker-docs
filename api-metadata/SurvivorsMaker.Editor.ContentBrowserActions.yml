  namespace: SurvivorsMaker.Editor
  summary: 'Creates one entry of <code class="paramref">kind</code> (optionally from a <code class="paramref">template</code>
    of that kind) and adds it to the content.

    Elites have no content list: create the asset and assign it to a spawn entry or horde.

    A summoner template also creates and registers the minion it summons.'
  example: []
  syntax:
    content: public static ContentAssetBase Create(ContentAsset content, BrowserContentKind kind, ContentTemplate template,
      string folder, string name)
    parameters:
    - id: content
      type: SurvivorsMaker.Data.ContentAsset
    - id: kind
      type: SurvivorsMaker.Editor.BrowserContentKind
    - id: template
      type: SurvivorsMaker.Editor.ContentTemplate
    - id: folder
      type: System.String
    - id: name
      type: System.String
    return:
      type: SurvivorsMaker.Data.ContentAssetBase
    content.vb: Public Shared Function Create(content As ContentAsset, kind As BrowserContentKind, template As ContentTemplate,
      folder As String, name As String) As ContentAssetBase
