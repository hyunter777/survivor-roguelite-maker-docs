site_name: Survivor Roguelite Maker
site_description: User guides and public API reference for Survivor Roguelite Maker.
site_url: https://hyunter777.github.io/survivor-roguelite-maker-docs/
repo_url: https://github.com/hyunter777/survivor-roguelite-maker-docs
edit_uri: ''
copyright: Copyright © FlyCat
theme:
  name: material
  language: en
  font: false
  features:
  - navigation.sections
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.tabs.link
  palette:
  - scheme: default
    primary: blue grey
    accent: cyan
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: blue grey
    accent: cyan
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
plugins:
- search:
    lang: en
- i18n:
    docs_structure: folder
    languages:
    - locale: en
      name: English
      default: true
      build: true
markdown_extensions:
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: true
nav:
