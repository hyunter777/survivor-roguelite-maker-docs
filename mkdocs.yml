  - Offers: authoring/offers.md
  - Enemies: authoring/enemies.md
  - Elites Bosses Hordes: authoring/elites-bosses-hordes.md
  - Waves Arenas: authoring/waves-arenas.md
  - Progression: authoring/progression.md
  - Settings: authoring/settings.md
- Maker tools:
